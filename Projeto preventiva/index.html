<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sites Vivo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./imagens/boneco da vivo.png" type="image/x-icon">
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap]
    (https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap)%22 
    rel="stylesheet">
</head>
<body>
    <!-- Container principal -->
    <div class="divSite">

        <!-- Grid contendo todos os cards -->
        <ul class="siteBotoes">

            <!-- Card 1 -->
            <li class="botoesIndividualmente">

                <!-- Cabeçalho do card -->
                <div class="cabecalhoCard">
                    <img src="./imagens/Jóia.png" alt="joia">
                    <h5>Site 1</h5>
                </div>

                <!-- Área dos botões -->
                <div class="grupoBotoes">
                    <a href="preventiva.html?site=Site 1">
                    <button class="botaoPreventiva">
                        Preventiva
                    </button>
                    </a>

                    <a href="auditoria.htm">
                    <button class="botaoPreventiva">
                        Auditoria
                    </button>
                    </a>
                </div>

            </li>

            <!-- Card 2 -->
            <li class="botoesIndividualmente">

                <div class="cabecalhoCard">
                    <img src="./imagens/king.png" alt="coroa">
                    <h5>Site 2</h5>
                </div>

                <div class="grupoBotoes">
                    <a href="preventiva.html?site=Site 2">
                    <button class="botaoPreventiva">Preventiva</button>
                    </a>
                    <a href="auditoria.htm">
                    <button class="botaoPreventiva">Auditoria</button>
                    </a>
                </div>

            </li>

            <!-- Card 3 -->
            <li class="botoesIndividualmente">

                <div class="cabecalhoCard">
                    <img src="./imagens/anel.png" alt="">
                    <h5>Site 3</h5>
                </div>

                <div class="grupoBotoes">
                    <a href="preventiva.html?site=Site 3">
                    <button class="botaoPreventiva">Preventiva</button>
                    </a>
                    <a href="auditoria.htm">
                    <button class="botaoPreventiva">Auditoria</button>
                    </a>
                </div>

            </li>

            <!-- Card 4 -->
            <li class="botoesIndividualmente">

                <div class="cabecalhoCard">
                    <img src="imagens/outros.png"></img>          
                     <h5>Site 4</h5>
                </div>

                <div class="grupoBotoes">
                    <a href="preventiva.html?site=Site 4">
                    <button class="botaoPreventiva">Preventiva</button>
                    </a>
                    <a href="auditoria.htm">
                    <button class="botaoPreventiva">Auditoria</button>
                    </a>
                </div>

            </li>

        </ul>

    </div>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
           // 1. Puxa os dados salvos da Auditoria
           let registros = JSON.parse(localStorage.getItem("preventivas")) || [];
           
           // 2. Conta quantos sites únicos já receberam preventiva
           let sitesFeitos = new Set(registros.map(reg => reg.site)).size;
           
           // 3. Define o total de sites na sua aplicação (Ex: 4 cards)
           const totalDeSites = 100; 
           
           // 4. Calcula a porcentagem
           let porcentagem = Math.round((sitesFeitos / totalDeSites) * 100);
           
           // 5. Atualiza TODOS os botões de preventiva na tela inicial
           const botoesPreventiva = document.querySelectorAll('.botaoPreventiva');
           
           botoesPreventiva.forEach(botao => {
               // Se o texto original do botão for "Preventiva"
               if(botao.textContent.trim() === "Preventiva") {
                   // Adiciona o texto de status
                   botao.innerHTML = `Preventiva <span style="font-size: 11px; opacity: 0.8; display: block;">${sitesFeitos}/${totalDeSites} concluídos (${porcentagem}%)</span>`;
               }
           });
        });
        </script>
</body>
</html>
