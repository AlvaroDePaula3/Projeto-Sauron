<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="preventiva.css">
    <title>Preventiva</title>
</head>
<body>

    <a href="index.html">
        <div class="seta">
        </div>
    </a>
<div class="paginaDaPreventiva">
    <div class="divisoriaDoFormulario">
        <h1> Preventiva</h1>
        <form action="/formulários-preventiva/" method="post">
            <!-- Nome do colaborador-->
            <div class="elementosFormulario">
                <label for="nome">Nome: </label><br>
                <input type="text" id="nome" name="nome" required>
            </div>
            <!-- Matrícula do colaborador -->
            <div class="elementosFormulario">
                    <label for="matricula">Matrícula: </label><br>
                    <input type="text" id="matricula" name="matricula" required>                
            </div>
            <!-- Data de hoje -->
             <div class="elementosFormulario">
                <label for="dataDeHoje">Data: </label><br>
                <input type="datetime" name="dataDeHoje" id="dataDeHoje">                    
             </div>
             <!-- Site-->
              <div class="elementosFormulario">
              <label for="Site"> Site: </label><br>
              <input type="text" name="Site" id="Site">
              </div>
              <!-- Descrição da atividade -->
               <div class="elementosFormulario">
               <label for="descricao"> Descrição: </label><br>
               <textarea type="text" name="descricao" rows="6" required></textarea>
               </div>
             <!-- Botão de enviar -->
              <div>
                <button class="" type="submit"> Enviar </button>
              </div>
        </form>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
