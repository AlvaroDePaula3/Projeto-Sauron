<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="preventiva.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Preventiva</title>
</head>
<body>

    <a href="index.html">
        <div class="seta">
        </div>
    </a>
<div class="paginaDaPreventiva">
    <div class="divisoriaDoFormulario">
        <h1> Preventiva</h1>
        <form action="/formulários-preventiva/" method="post">
            <!-- Nome do colaborador-->
            <div class="elementosFormulario">
                <label for="nome">Nome: </label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <!-- Matrícula do colaborador -->
            <div class="elementosFormulario">
                    <label for="matricula">Matrícula: </label>
                    <input type="text" id="matricula" name="matricula" required>                
            </div>

            <!-- Data de hoje -->
            <div class="elementosFormulario">
                <label for="dataDeHoje">Data de hoje: </label>
                <input type="date" name="dataDeHoje" id="dataDeHoje" readonly> 
            </div>

            <!-- Data de finalização-->
            <div class="elementosFormulario">
                <label for="dataFinal">Data do prazo: </label>
                <input type="date" name="dataFinal" id="dataFinal"> 
            </div>
             <!-- Site-->
              <div class="elementosFormulario">
              <label for="Site"> Site: </label>
              <input type="text" name="Site" id="Site">
              </div>
              <div>
                <label for="subtipos"> Modelo: </label>
                <select name="subtipos" id="subtipos">
                    <option value="subtipo1"> Site 1</option>
                    <option value="subtipo2"> Site 2</option>
                    <option value="subtipo3"> Site 3</option>
                    <option value="subtipo4"> Site 4</option>
                    <option value="subtipo4"> Site 5</option>

                </select>
              </div>
              <!-- Descrição da atividade -->
               <div class="elementosFormulario">
               <label for="descricao"> Descrição: </label>
               <textarea type="text" name="descricao" rows="6" required></textarea>
               </div>

               <!-- Galeria de Fotos -->
               <div class="elementosFormulario areaGaleria">
                    <label for="fotos">Anexar Fotos: </label>
                    <input type="file" id="fotos" name="fotos" accept="image/*" multiple>
                    <div class="previewFotos" id="previewFotos">
                        <p> Nenhuma foto selecionada </p>
                    </div>            
               </div>
             <!-- Botão de enviar -->
              <div>
                <button class="" type="submit"> Enviar </button>
              </div>
        </form>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
